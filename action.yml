name: TesterArmy Mobile CI
description: Upload a mobile app to TesterArmy, run AI-powered tests, and clean up.
branding:
  icon: smartphone
  color: purple

inputs:
  app_path:
    description: Path to the app build file or directory to upload.
    required: true
  api_key:
    description: TesterArmy API key.
    required: true
  project_id:
    description: TesterArmy project ID.
    required: true
  group_id:
    description: TesterArmy group ID.
    required: true
  platform:
    description: Mobile runtime platform. Use ios for iOS Simulator apps or android for APKs.
    required: false
    default: "ios"
  delete_app_after_run:
    description: Delete the uploaded app after terminal test runs.
    required: false
    default: "true"
  remove_after:
    description: Seconds after which TesterArmy should remove the upload. Set to 0 to disable.
    required: false
    default: "3600"

outputs:
  app_id:
    description: Uploaded TesterArmy app ID.
    value: ${{ steps.upload.outputs.app_id }}
  overall_status:
    description: Overall status of the test run (passed, failed, or timed_out).
    value: ${{ steps.run.outputs.overall_status }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v5
      with:
        node-version: "24"

    - id: upload
      name: Upload mobile app
      shell: bash
      env:
        APP_PATH: ${{ inputs.app_path }}
        PROJECT_ID: ${{ inputs.project_id }}
        REMOVE_AFTER: ${{ inputs.remove_after }}
        TESTERARMY_API_KEY: ${{ inputs.api_key }}
      run: |
        set -euo pipefail

        mkdir -p .testerarmy

        args=(
          upload-app
          --app-path "$APP_PATH"
          --project "$PROJECT_ID"
          --output .testerarmy/upload.json
        )

        if [ "$REMOVE_AFTER" != "0" ]; then
          args+=(--remove-after "$REMOVE_AFTER")
        fi

        npx --yes testerarmy@latest "${args[@]}"

        APP_ID="$(
          node -e "const fs = require('node:fs'); const data = JSON.parse(fs.readFileSync('.testerarmy/upload.json', 'utf8')); if (!data.uploadedAppId) throw new Error('Missing uploadedAppId in .testerarmy/upload.json'); process.stdout.write(data.uploadedAppId);"
        )"
        echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"

    - id: run
      name: Run tests
      shell: bash
      env:
        TESTERARMY_API_KEY: ${{ inputs.api_key }}
        APP_ID: ${{ steps.upload.outputs.app_id }}
        GROUP_ID: ${{ inputs.group_id }}
        PROJECT_ID: ${{ inputs.project_id }}
        PLATFORM: ${{ inputs.platform }}
        COMMIT_SHA: ${{ github.sha }}
        DELETE_APP_AFTER_RUN: ${{ inputs.delete_app_after_run }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number || '' }}
      run: |
        set -uo pipefail

        mkdir -p .testerarmy

        args=(
          ci
          --group "$GROUP_ID"
          --project "$PROJECT_ID"
          --platform "$PLATFORM"
          --app-id "$APP_ID"
          --commit-sha "$COMMIT_SHA"
          --output .testerarmy/ci-result.json
        )

        if [ "$DELETE_APP_AFTER_RUN" = "true" ]; then
          args+=(--delete-app-after-run)
        fi

        if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_NUMBER" ]; then
          args+=(--pr-number "$PR_NUMBER")
        fi

        npx --yes testerarmy@latest "${args[@]}"
        exit_code=$?

        if [ -f .testerarmy/ci-result.json ]; then
          OVERALL_STATUS="$(
            node -e "const fs = require('node:fs'); const data = JSON.parse(fs.readFileSync('.testerarmy/ci-result.json', 'utf8')); process.stdout.write(data.summary?.result ?? '');"
          )"
          echo "overall_status=$OVERALL_STATUS" >> "$GITHUB_OUTPUT"
        fi

        exit "$exit_code"
